<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- PRUNplanner is a dark UI and has no light theme. Saying so is
		 not cosmetic: a browser that is not told a page handles dark mode
		 applies its own automatic darkening, which re-maps the near black
		 fills of the charts to white and leaves the saturated series
		 colours alone — the visualisations render inside out. -->
		<meta name="color-scheme" content="dark" />
		<title>PRUNplanner</title>
		<meta
			name="description"
			content="Prosperous Universe Empire and Base Planning tool. Plan your empire and projects, dominate the markets." />
		<meta
			name="keywords"
			content="prosperous universe, tool, game, base planner, prunner, pmmg, planet, plan" />
		<meta name="robots" content="index, follow" />
		<meta
			http-equiv="Content-Type"
			content="text/html; charset=text/html; charset=utf-8" />
		<meta name="language" content="English" />
		<meta name="author" content="Scorpio" />
	</head>
	<body>
		<div id="app"></div>
		<script src="/env.js"></script>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
